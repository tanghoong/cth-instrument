<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Suit — cth-instrument lab</title>
<link rel="stylesheet" href="panel.css">
<style>
  :root {
    --bg: #050a12; --panel: rgba(14, 26, 44, .62); --edge: #1d3a5c; --ink: #dbeafe;
    --dim: #6b8bb0; --track: #12233a; --tick: #2f5580;
    --a1: #35c9ff; --a2: #64e37a; --a3: #ffd23f; --a4: #ff5c5c;
    --bg-image:
      radial-gradient(900px 560px at 50% -10%, rgba(53,201,255,.12), transparent 64%),
      linear-gradient(rgba(53,201,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,201,255,.05) 1px, transparent 1px);
    --radius: 2px;
    --cell-shadow: inset 0 0 0 1px rgba(53,201,255,.06);
  }
  body { background-size: auto, 40px 40px, 40px 40px; }
  h1 { color: var(--a1); padding-left: .5rem; border-left: 3px solid var(--a1); }
  cth-knob::part(value) { filter: drop-shadow(0 0 4px currentColor); }

  /* ---- the linear seat ---------------------------------------------------
     A mobile suit cockpit is a sphere of screen: the pilot sits inside the
     view with the instruments bevelled into the wall around it. The suit
     itself is the thing in the middle, big, because it is what the sortie is
     about — everything else is arranged in reading order around it. */

  /* Plates are cut, not rounded. Two opposite corners come off, which is what
     makes a panel read as armour rather than as a card. */
  .cell {
    clip-path: polygon(13px 0, 100% 0, 100% calc(100% - 13px),
                       calc(100% - 13px) 100%, 0 100%, 0 13px);
  }
  .cell::before, .cell::after {
    content: ''; position: absolute; width: 10px; height: 10px; pointer-events: none;
    border: 1px solid var(--a1); opacity: .5;
  }
  .cell::before { top: 3px; left: 16px; border-right: 0; border-bottom: 0; }
  .cell::after  { bottom: 3px; right: 16px; border-left: 0; border-top: 0; }

  /* Attitude left, the suit centre and large, the scope right — but only
     once there is width for three. Below that panel.css auto-fits them. */
  @media (min-width: 900px) {
    .row.main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr); }
    .row.crew { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr); }
  }
  .row.main .cell { background: #04080f; }
  .row.main cth-horizon { --cthh-size: min(27vh, 260px); }
  .row.main cth-radar { --cthr-size: min(27vh, 260px); }

  /* The pilot's own band, under the suit. */
  .row.crew cth-trace {
    --cth-height: min(15vh, 140px); --cth-trace: #ff5c5c;
    --cth-grid: rgba(255, 92, 92, .14); --cth-face: transparent; --cth-pen: #ff9aa0;
  }
  .vitals-line {
    margin-top: .2rem; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim);
  }
  .vitals-line b { color: var(--a2); font-weight: 600; }
  .vitals-line b.strained { color: var(--a3); }
  .vitals-line b.critical { color: var(--a4); }

  /* ---- the frame ---------------------------------------------------------
     Armour sections take their colour from their own integrity; the joints,
     vents and the cockpit hatch are drawn in the panel's own edge colour so
     they read as detail rather than as another reading. */
  .mech { block-size: min(32vh, 320px); inline-size: auto; }
  .mech [data-part] {
    fill: currentColor; fill-opacity: .22;
    stroke: currentColor; stroke-width: 1.5;
    stroke-linejoin: round;
    transition: color .3s linear, fill-opacity .3s linear;
  }
  .mech .frame-line { fill: none; stroke: var(--edge); stroke-width: 1.1; }
  .mech .lens { fill: var(--a1); fill-opacity: .5; stroke: none; }
  /* Held equipment carries no integrity, so it never takes a damage
     colour — it is drawn as hardware and left alone. */
  .mech .gear { fill: #0b1c30; stroke: var(--a1); stroke-width: 1.1;
                stroke-linejoin: round; opacity: .82; }

  /* Scanlines and the curve of the glass. Static: a cockpit does not need a
     flicker, and an animated overlay under everything is a tax on every frame
     the dials are already paying for. */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .26) 0 1px, transparent 1px 3px),
      radial-gradient(126% 104% at 50% 46%, transparent 56%, rgba(0, 0, 0, .6) 100%);
  }

  /* The caution lamp only exists when there is something to say. */
  .strip .flag > span:not(:empty) {
    display: inline-block; padding: .1rem .45rem;
    border: 1px solid currentColor; color: var(--a4);
    text-shadow: 0 0 8px currentColor;
    animation: caution 1.1s steps(2, end) infinite;
  }
  @keyframes caution { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    .strip .flag > span:not(:empty) { animation: none; }
  }
</style>
</head>
<body>
<script type="module">
  import { buildPanel, wave, clamp } from './panel.js';
  import '../src/cth-horizon.js';
  import '../src/cth-radar.js';
  import '../src/cth-trace.js';

  const LIMBS = [
    ['head', '#35c9ff'], ['torso', '#35c9ff'], ['l-arm', '#64e37a'], ['r-arm', '#64e37a'],
    ['l-leg', '#64e37a'], ['r-leg', '#64e37a'], ['backpack', '#ffd23f'], ['shield', '#ffd23f'],
  ];

  const panel = buildPanel({
    title: 'RX-1013 · pilot cth · linear seat — combat simulation',
    status: [
      { id: 'state', lead: true, value: 'SORTIE' },
      { id: 'gen', label: 'generator', value: '—' },
      { id: 'prop', label: 'propellant', value: '—' },
      { id: 'apo', label: 'apogee motor', value: '—' },
      { id: 'pilot', label: 'pilot', value: '—' },
      { id: 'threat', label: 'threat', value: '—' },
      { id: 'alert', flag: true, value: '' },
    ],
    rows: [
      // Where the pilot looks first: how the suit is lying, what it is, and
      // what is around it. The silhouette is inserted between these two.
      {
        size: 'lg', flex: '2.4', items: [
          { id: 'att', tag: 'cth-horizon', cap: 'Attitude · linear seat' },
          { id: 'scope', tag: 'cth-radar', cap: 'Minovsky scope · contacts' },
        ],
      },
      // The pilot's own band.
      {
        size: 'lg', flex: '1', items: [
          { id: 'reactor', cap: 'Fusion output', min: 0, max: 120, sweep: 270, readout: 'value',
            decimals: 1, ticks: 12, tickMajor: 6, label: '% rated', color: 'var(--a1)',
            zones: '100-110:#4a3d10, 110-120:#4a1a1a', benchmark: 100 },
          { id: 'vitals', tag: 'cth-trace', cap: 'Pilot vitals' },
          { id: 'beam', cap: 'Beam charge', min: 0, max: 100, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: '%', color: 'var(--a1)', benchmark: 80,
            zones: '0-25:#4a1a1a' },
        ],
      },
      // The eight numbers behind the silhouette.
      {
        size: 'sm',
        items: LIMBS.map(([name, color]) => ({
          id: name, cap: name, min: 0, max: 100, sweep: 270, readout: 'value',
          ticks: 10, tickMajor: 5, label: '%', color, zones: '0-25:#4a1a1a',
        })),
      },
      // Everything that is a quantity rather than a state.
      {
        size: 'md', items: [
          { id: 'thrust', cap: 'Thruster vector', min: 0, max: 100, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: '%', color: 'var(--a3)' },
          { id: 'propellant', cap: 'Propellant', min: 0, max: 100, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: '%', color: 'var(--a2)', zones: '0-15:#4a1a1a' },
          { id: 'gforce', cap: 'Pilot g-load', min: 0, max: 12, sweep: 270, readout: 'value',
            decimals: 1, ticks: 12, tickMajor: 6, label: 'g', color: 'var(--a3)',
            zones: '8-10:#4a3d10, 10-12:#4a1a1a' },
          { id: 'psyco', cap: 'Psycommu link', min: 0, max: 100, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: '%', color: 'var(--a1)' },
          { id: 'heat', cap: 'Heat sink', min: 0, max: 100, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: '%', color: 'var(--a4)',
            zones: '75-90:#4a3d10, 90-100:#4a1a1a' },
          { id: 'ammo', cap: 'Rifle magazine', min: 0, max: 20, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: 'rds', color: 'var(--a3)', zones: '0-4:#4a1a1a' },
          { id: 'vulcan', cap: 'Head vulcan', min: 0, max: 60, sweep: 270, readout: 'value',
            ticks: 6, tickMajor: 3, label: 'rds', color: 'var(--a3)' },
          { id: 'radar', cap: 'Minovsky density', min: 0, max: 100, sweep: 270, readout: 'value',
            ticks: 10, tickMajor: 5, label: '%', color: 'var(--a4)', zones: '70-100:#4a3d10' },
          { id: 'contacts', cap: 'Contacts', min: 0, max: 24, sweep: 360, readout: 'value',
            ticks: 24, tickMajor: 6, label: 'bogeys', color: 'var(--a4)' },
        ],
      },
    ],

    // A sortie on a loop: three engagements, each of which spikes thrust, heat
    // and g-load together and eats propellant, ammunition and armour.
    tick(t, set) {
      const CYCLE = 96;
      const u = t % CYCLE;
      const engagements = [18, 46, 74];
      let intensity = 0.12;
      for (const e of engagements) intensity += 0.9 * Math.exp(-((u - e) ** 2) / 26);
      intensity = clamp(intensity, 0, 1);

      const thrust = 18 + intensity * 78;
      const heat = 22 + intensity * 68;
      const contacts = Math.round(intensity * 18 + 2);

      set('reactor', 62 + intensity * 46, 1);
      set('thrust', thrust);
      set('heat', heat);
      set('gforce', 1 + intensity * 9.4, 1);
      set('beam', clamp(100 - intensity * 92 + (u % 12) * 5, 0, 100));
      set('propellant', clamp(96 - (u / CYCLE) * 62, 0, 100));
      set('psyco', 78 + wave(t, 9, 16));
      set('ammo', Math.max(0, Math.round(20 - (u / CYCLE) * 17)));
      set('vulcan', Math.max(0, Math.round(60 - (u / CYCLE) * 44)));
      set('radar', 34 + intensity * 52);
      set('contacts', contacts);

      const damage = (u / CYCLE) * 34;
      LIMBS.forEach(([name], i) => {
        set(name, clamp(100 - damage * (0.5 + (i % 4) * 0.42) - wave(t, 13 + i, 6, i), 0, 100));
      });

      // The silhouette reads the same eight numbers the dials below do.
      paintFrame(LIMBS.map(([name]) => [name, +(set.knob(name)?.getAttribute('value') ?? 100)]));

      // The suit banks into an engagement and levels out of it.
      set.attr('att', 'pitch', (wave(t, 7, 14) - intensity * 16).toFixed(1));
      set.attr('att', 'roll', (wave(t, 5, 22) * (0.4 + intensity)).toFixed(1));

      // Contacts on the scope are the same number the Contacts dial reads.
      const blips = [];
      for (let i = 0; i < contacts; i++) {
        const bearing = (i * 47 + t * 6 + wave(t, 11 + i, 40, i)) % 360;
        const range = 0.25 + ((i * 37) % 70) / 100;
        blips.push(bearing.toFixed(0) + ':' + range.toFixed(2));
      }
      set.attr('scope', 'blips', blips.join(', '));

      // A linear seat takes the g straight into the spine, so the heart
      // follows the manoeuvre and the condition follows the g.
      const g = 1 + intensity * 9.4;
      const bpm = Math.round(64 + intensity * 74 + g * 2.2);
      if (vitals.getAttribute('beat') !== String(bpm)) vitals.setAttribute('beat', bpm);
      bpmEl.textContent = bpm + ' bpm';
      const cond = g > 8.2 ? ['GREY-OUT RISK', 'critical']
        : g > 5.4 ? ['STRAINED', 'strained'] : ['STABLE', ''];
      if (condEl.textContent !== cond[0]) {
        condEl.textContent = cond[0];
        condEl.className = cond[1];
      }

      set.text('state', intensity > 0.5 ? 'ENGAGED' : 'SORTIE');
      set.text('gen', (62 + intensity * 46).toFixed(0) + ' %');
      set.text('prop', clamp(96 - (u / CYCLE) * 62, 0, 100).toFixed(0) + ' %');
      set.text('apo', heat > 78 ? 'THERMAL LIMIT' : 'NOMINAL');
      set.text('pilot', bpm + ' bpm · ' + cond[0].toLowerCase());
      set.text('threat', contacts + ' contacts · nearest '
        + (0.3 + (1 - intensity) * 1.9).toFixed(1) + ' km');
      set.text('alert', heat > 82 ? '▲ HEAT CRITICAL — VENT'
        : intensity > 0.7 ? '▲ MULTIPLE CONTACTS' : '');
    },
  });

  // ---- the band -----------------------------------------------------------
  // Attributes these three need are not in the shared list panel.js writes.
  const att = panel.knobs.att, scope = panel.knobs.scope, vitals = panel.knobs.vitals;
  att.setAttribute('ladder-step', '10');
  scope.setAttribute('rings', '4');
  scope.setAttribute('spokes', '12');
  scope.setAttribute('period', '4');
  scope.setAttribute('labels', 'N,E,S,W');
  vitals.setAttribute('grid', '');
  vitals.setAttribute('readout', 'none');
  vitals.setAttribute('rate', '90');
  vitals.setAttribute('beat', '64');

  const rows = document.querySelectorAll('.row');
  rows[0].classList.add('main');
  rows[1].classList.add('crew');

  // ---- the frame ----------------------------------------------------------
  // A front elevation: one shape per armour section, coloured from that
  // section's own integrity, with the joints and vents drawn as detail so the
  // colour never has to compete with the linework.
  const MECH = [
    '<svg class="mech" viewBox="0 0 220 300" role="img"',
    ' aria-label="Frame integrity by section">',

    // backpack, behind everything
    '<path data-part="backpack" d="M78 46h64v16l-6 8H84l-6-8z"/>',
    '<path data-part="backpack" d="M72 66h18v40l-9 12-9-12z"/>',
    '<path data-part="backpack" d="M130 66h18v40l-9 12-9-12z"/>',

    // head: V-fin, helmet, visor, chin
    '<path data-part="head" d="M104 18 80 4l9 14z"/>',
    '<path data-part="head" d="M116 18 140 4l-9 14z"/>',
    '<path data-part="head" d="M110 4 103 18h14z"/>',
    '<path data-part="head" d="M110 16 97 22v13l5 10h16l5-10V22z"/>',
    '<path class="frame-line" d="M101 26h18l-2 8h-14z"/>',
    '<circle class="lens" cx="104" cy="30" r="2.1"/>',
    '<circle class="lens" cx="116" cy="30" r="2.1"/>',
    '<path class="frame-line" d="M104 40h12M110 45v6"/>',

    // torso: chest, cockpit hatch, abdomen, skirt
    '<path data-part="torso" d="M84 50h52l10 15v33l-9 13H83l-9-13V65z"/>',
    '<path class="frame-line" d="M92 60h11v15H92zM117 60h11v15h-11z"/>',
    '<path class="frame-line" d="M100 82h20v14h-20z"/>',
    '<path data-part="torso" d="M94 112h32l3 15-3 9H94l-3-9z"/>',
    '<path data-part="torso" d="M80 138h60l6 15-9 9h-54l-9-9z"/>',
    '<path class="frame-line" d="M110 138v24"/>',

    // arms: pauldron, upper, forearm, hand
    '<path data-part="l-arm" d="M46 50h30v7l4 4v18l-6 7H50l-4-7V57z"/>',
    '<path data-part="l-arm" d="M54 89h18v25H54z"/>',
    '<path data-part="l-arm" d="M51 116h24v33l-4 11H55l-4-11z"/>',
    '<path data-part="l-arm" d="M55 162h16v11H55z"/>',
    '<path class="frame-line" d="M54 114h18"/>',
    '<path data-part="r-arm" d="M174 50h-30v7l-4 4v18l6 7h20l4-7V57z"/>',
    '<path data-part="r-arm" d="M166 89h-18v25h18z"/>',
    '<path data-part="r-arm" d="M169 116h-24v33l4 11h16l4-11z"/>',
    '<path data-part="r-arm" d="M165 162h-16v11h16z"/>',
    '<path class="frame-line" d="M148 114h18"/>',

    // beam rifle, held in the right hand
    '<path class="gear" d="M166 122h20v42h-20z"/>',
    '<path class="gear" d="M172 92h8v30h-8z"/>',
    '<path class="gear" d="M164 130h24v8h-24z"/>',
    '<path class="gear" d="M186 140h7v18h-7z"/>',
    '<path class="gear" d="M168 164h12v12h-12z"/>',
    '<path class="frame-line" d="M176 96v24"/>',

    // shield, outboard on the left arm
    '<path data-part="shield" d="M14 44h26l6 16v72l-19 22-19-22V60z"/>',
    '<path class="frame-line" d="M20 62h20M20 78h20M27 96v40"/>',

    // legs: thigh, knee, shin, foot
    '<path data-part="l-leg" d="M86 162h18l2 30-2 26H84l-2-26z"/>',
    '<path data-part="l-leg" d="M84 220h22l2 38-4 18H86l-4-18z"/>',
    '<path data-part="l-leg" d="M76 278h30v12H76z"/>',
    '<path class="frame-line" d="M84 218h22"/>',
    '<path data-part="r-leg" d="M134 162h-18l-2 30 2 26h18l2-26z"/>',
    '<path data-part="r-leg" d="M136 220h-22l-2 38 4 18h16l4-18z"/>',
    '<path data-part="r-leg" d="M144 278h-30v12h30z"/>',
    '<path class="frame-line" d="M114 218h22"/>',
    '</svg>',
  ].join('');

  const mechCell = document.createElement('div');
  mechCell.className = 'cell';
  mechCell.innerHTML = MECH
    + '<div class="cap">Frame integrity</div>'
    + '<div class="legend">'
    +   '<span><i style="background:#64e37a"></i>intact</span>'
    +   '<span><i style="background:#ffd23f"></i>damaged</span>'
    +   '<span><i style="background:#ff8a3d"></i>failing</span>'
    +   '<span><i style="background:#ff5c5c"></i>lost</span>'
    + '</div>';
  rows[0].insertBefore(mechCell, rows[0].children[1]);

  // One colour per section, stepped rather than ramped: a pilot needs to know
  // which band a limb is in, not its exact percentage.
  const parts = {};
  for (const el of mechCell.querySelectorAll('[data-part]')) {
    (parts[el.dataset.part] ??= []).push(el);
  }
  const band = (v) => v > 75 ? '#64e37a' : v > 45 ? '#ffd23f' : v > 20 ? '#ff8a3d' : '#ff5c5c';
  function paintFrame(readings) {
    for (const [name, v] of readings) {
      for (const el of parts[name] ?? []) {
        el.style.color = band(v);
        el.style.fillOpacity = 0.1 + (v / 100) * 0.28;
      }
    }
  }

  // ---- the pilot ----------------------------------------------------------
  const bpmEl = document.createElement('b');
  bpmEl.textContent = '64 bpm';
  const condEl = document.createElement('b');
  condEl.textContent = 'STABLE';
  const vLine = document.createElement('div');
  vLine.className = 'vitals-line';
  vLine.append(bpmEl, document.createTextNode(' · '), condEl);
  vitals.closest('.cell').append(vLine);
</script>
</body>
</html>
